services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auxiliar_contable}
      POSTGRES_USER: ${POSTGRES_USER:-auxiliar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"   # expuesto solo en localhost para PgAdmin vía túnel SSH
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auxiliar}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auxiliar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-auxiliar_contable}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"   # CloudPanel / Cloudflare Tunnel apuntan aquí
    depends_on:
      - api

volumes:
  pgdata:
